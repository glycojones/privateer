
[build-system]
requires = ["scikit-build-core>=0.3.3", "pybind11"]
build-backend = "scikit_build_core.build"


[project]
name = "Privateer"
version = "0.5"
description="he Swiss Army knife for carbohydrate structure validation, refinement and analysis"
readme = "README.md"
authors = [
  { name = "Jon Agirre", email = "jon.agirre@york.ac.uk" },
  { name = "Haroldas Bagdonas"},
  { name = "Jordan Dialpuri", email = "jordan.dialpuri@york.ac.uk" },
]
requires-python = ">=3.9"

test = ["pytest"]


[tool.scikit-build]
wheel.expand-macos-universal-tags = true


[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
log_cli_level = "INFO"
filterwarnings = [
  "error",
  "ignore::pytest.PytestCacheWarning",
]
testpaths = ["tests"]


[tool.cibuildwheel]
build-frontend = "build[uv]"
test-command = "pytest {project}/tests"
test-extras = ["test"]
