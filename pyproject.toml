[build-system]
requires = [
  "ChimeraX-BundleBuilder>=1.4.0",
  "ChimeraX-Core ~=1.10.1",
  "ChimeraX-Atomic ~=1.6",
  "ChimeraX-Surface ~=1.0",
  "ChimeraX-Geometry ~=1.0",
  "ChimeraX-UI ~=1.5",
  "pandas ~=2.2",
]
build-backend = "chimerax.bundle_builder.cx_pep517"

[project]
name = "Privateer-for-ChimeraX"
license = { text = "OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)" }
authors = [{ name = "Glycojones Team, University of York", email = "jon.agirre@york.ac.uk" }]
description = "Privateer is a tool for carbohydrate validation, graphical analysis, and visualisation."
dependencies = [
  "ChimeraX-Core ~=1.10.1",
  "ChimeraX-Atomic ~=1.6",
  "ChimeraX-Surface ~=1.0",
  "ChimeraX-Geometry ~=1.0",
  "ChimeraX-UI ~=1.5",
  "pandas ~=2.2",
]
dynamic = ["classifiers", "requires-python", "version"]

[project.readme]
content-type = "text"
text = """Produces an interactive validation report on carbohydrates present within the structure. Hovering over elements of the validation report or clicking on elements can provide more detail. Also provides option to visualise 3D glycan symbols on the model."""

[project.urls]
Home = "https://github.com/glycojones/privateer"


[tool.chimerax]
min-session-version = 1
max-session-version = 1
custom-init = false
categories = ["General"]
classifiers = ["Development Status :: 2 - Pre-Alpha"]

[tool.chimerax.package-data]
"src/data" = [
  "**",
]
"src/docs" = [
  "**",
]

[tool.chimerax.extra-files]
"src/include" = [
  "src/dependencies/**"
]

[tool.chimerax.command.privateer_validation]
category="Validation"
description="Produces a vlidation report from privateer, either displayed in ChimeraX or saved to csv."

[tool.chimerax.command.privateer_glycoblocks]
category="Validation"
description="Generates 3D glycan symbols matching standard SNFGs overlayed with the model in ChimeraX's viewer."

[tool.chimerax.command.privateer_torsion_plot]
category="Validation"
description="Produces a torsion plot of a specified linkage if there is enough data in privateer's torsion database."

[tool.chimerax.tool."Privateer - Validate Carbohydrates"]
category="Validation"
description="Produces a torsion plot of a specified linkage if there is enough data in privateer's torsion database."

